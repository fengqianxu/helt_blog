# Coolify attaches every service to its resource-scoped network and connects
# the platform proxy to that same network. Do not add custom networks here:
# Traefik may otherwise select an address that the proxy cannot reach.
services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      artalk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public URL, for example https://blog.example.com}
      INTERNAL_API_ORIGIN: http://backend:3000
      TZ: Asia/Shanghai
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cap_drop:
      - ALL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helt_blog}
      POSTGRES_USER: ${POSTGRES_USER:-helt}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-helt_minio}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MINIO}
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  minio-init:
    build:
      context: .
      dockerfile: storage-init/Dockerfile
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-helt_minio}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_64_MINIO}
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-helt}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-helt_blog}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-1}
      RUN_MIGRATIONS: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-helt_minio}
      MINIO_SECRET_KEY: ${SERVICE_PASSWORD_64_MINIO}
      MINIO_PUBLIC_BUCKET: blog-public
      MINIO_PRIVATE_BUCKET: blog-private
      ADMIN_USERNAME: ${ADMIN_USERNAME:-helt}
      ADMIN_INITIAL_PASSWORD: ${SERVICE_PASSWORD_64_ADMIN}
      AUTH_JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      ARTALK_INTERNAL_URL: http://artalk:23366
      ARTALK_SITE_NAME: helt.
      ARTALK_ADMIN_NAME: blog-service
      ARTALK_ADMIN_EMAIL: artalk-service@localhost.invalid
      ARTALK_ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_ARTALK_ADMIN}
      LLM_ENCRYPTION_KEY: ${SERVICE_PASSWORD_64_LLM}
      LLM_ENCRYPTION_KEY_VERSION: ${LLM_ENCRYPTION_KEY_VERSION:-1}
      LLM_ENCRYPTION_PREVIOUS_KEY: ${LLM_ENCRYPTION_PREVIOUS_KEY:-}
      LLM_ENCRYPTION_PREVIOUS_KEY_VERSION: ${LLM_ENCRYPTION_PREVIOUS_KEY_VERSION:-}
      LLM_PRIVATE_HOST_ALLOWLIST: ${LLM_PRIVATE_HOST_ALLOWLIST:-}
      METING_API_URL: ${METING_API_URL:-http://meting:3000/api}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public URL, for example https://blog.example.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${PUBLIC_ORIGIN}}
      REQUEST_TIMEOUT_SECS: ${REQUEST_TIMEOUT_SECS:-30}
      ASSET_REQUEST_TIMEOUT_SECS: ${ASSET_REQUEST_TIMEOUT_SECS:-300}
      UPSTREAM_REQUEST_TIMEOUT_SECS: ${UPSTREAM_REQUEST_TIMEOUT_SECS:-15}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TZ: Asia/Shanghai
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      meting:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/blog-backend", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL

  # Private Meting-compatible resolver for NetEase/QQ playlists. It needs
  # outbound access but is never exposed through the public gateway.
  meting:
    image: ghcr.io/mikus-loli/meting-api:latest
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      TZ: Asia/Shanghai
    expose:
      - "3000"
    volumes:
      - meting_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  artalk:
    image: artalk/artalk-go:2.10.0
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      ATK_LOCALE: zh-CN
      ATK_APP_KEY: ${SERVICE_PASSWORD_64_ARTALK}
      ATK_SITE_DEFAULT: helt.
      ATK_ADMIN_USERS_0_NAME: blog-service
      ATK_ADMIN_USERS_0_EMAIL: artalk-service@localhost.invalid
      ATK_ADMIN_USERS_0_PASSWORD: ${SERVICE_PASSWORD_64_ARTALK_ADMIN}
      ATK_ADMIN_USERS_0_BADGE_NAME: Administrator
      ATK_ADMIN_USERS_0_RECEIVE_EMAIL: "false"
      ATK_SITE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public URL, for example https://blog.example.com}
      ATK_TRUSTED_DOMAINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public URL, for example https://blog.example.com}
      ATK_DB_TYPE: pgsql
      ATK_DB_HOST: postgres
      ATK_DB_PORT: 5432
      ATK_DB_NAME: ${POSTGRES_DB:-helt_blog}
      ATK_DB_USER: ${POSTGRES_USER:-helt}
      ATK_DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      ATK_DB_TABLE_PREFIX: artalk_
      ATK_HTTP_PROXY_HEADER: X-Real-IP
      ATK_MODERATOR_PENDING_DEFAULT: ${ARTALK_PENDING_DEFAULT:-true}
      ATK_IMG_UPLOAD_PATH: /data/artalk-img/
      ATK_IMG_UPLOAD_PUBLIC_PATH: /artalk/static/images/
    expose:
      - "23366"
    volumes:
      - artalk_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      # On an empty database the backend records the two retired Artalk reset
      # migrations before Artalk creates its schema. Existing installations are
      # protected by the backend migration guard and the documented upgrade flow.
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:23366/api/v2/conf"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    cap_drop:
      - ALL
volumes:
  postgres_data:
  minio_data:
  artalk_data:
  meting_data:
