name: helt-blog

services:
  gateway:
    image: ${IMAGE_PREFIX:-helt-blog}-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:80"
    networks:
      - edge
      - web
      - api
      - storage
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      artalk:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${IMAGE_PREFIX:-helt-blog}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TZ: Asia/Shanghai
    expose:
      - "3000"
    networks:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helt_blog}
      POSTGRES_USER: ${POSTGRES_USER:-helt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    networks:
      - database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-helt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    networks:
      - storage
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-helt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
    networks:
      - storage
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing local/blog-public
        mc mb --ignore-existing local/blog-private
        mc anonymous set download local/blog-public
        mc anonymous set none local/blog-private
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${IMAGE_PREFIX:-helt-blog}-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-helt}:${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-helt_blog}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-1}
      RUN_MIGRATIONS: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-helt_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Copy .env.example to .env and set MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_BUCKET: blog-public
      MINIO_PRIVATE_BUCKET: blog-private
      ADMIN_USERNAME: ${ADMIN_USERNAME:-helt}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Copy .env.example to .env and set AUTH_JWT_SECRET}
      ARTALK_INTERNAL_URL: http://artalk:23366
      ARTALK_SITE_NAME: helt.
      ARTALK_ADMIN_NAME: ${ARTALK_ADMIN_NAME:-blog-service}
      ARTALK_ADMIN_EMAIL: ${ARTALK_ADMIN_EMAIL:-artalk-service@localhost.invalid}
      ARTALK_ADMIN_PASSWORD: ${ARTALK_ADMIN_PASSWORD:?Copy .env.example to .env and set ARTALK_ADMIN_PASSWORD}
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:?Copy .env.example to .env and set an independent LLM_ENCRYPTION_KEY}
      LLM_ENCRYPTION_KEY_VERSION: ${LLM_ENCRYPTION_KEY_VERSION:-1}
      LLM_ENCRYPTION_PREVIOUS_KEY: ${LLM_ENCRYPTION_PREVIOUS_KEY:-}
      LLM_ENCRYPTION_PREVIOUS_KEY_VERSION: ${LLM_ENCRYPTION_PREVIOUS_KEY_VERSION:-}
      LLM_PRIVATE_HOST_ALLOWLIST: ${LLM_PRIVATE_HOST_ALLOWLIST:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Copy .env.example to .env and set PUBLIC_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${PUBLIC_ORIGIN}}
      REQUEST_TIMEOUT_SECS: ${REQUEST_TIMEOUT_SECS:-30}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,tower_http=info}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      TZ: Asia/Shanghai
    expose:
      - "3000"
    networks:
      - api
      - database
      - storage
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/blog-backend", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  artalk:
    image: artalk/artalk-go:2.10.0
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      ATK_LOCALE: zh-CN
      ATK_APP_KEY: ${ARTALK_APP_KEY:-${AUTH_JWT_SECRET}}
      ATK_SITE_DEFAULT: helt.
      ATK_ADMIN_USERS_0_NAME: ${ARTALK_ADMIN_NAME:-blog-service}
      ATK_ADMIN_USERS_0_EMAIL: ${ARTALK_ADMIN_EMAIL:-artalk-service@localhost.invalid}
      ATK_ADMIN_USERS_0_PASSWORD: ${ARTALK_ADMIN_PASSWORD:?Copy .env.example to .env and set ARTALK_ADMIN_PASSWORD}
      ATK_ADMIN_USERS_0_BADGE_NAME: Administrator
      ATK_ADMIN_USERS_0_RECEIVE_EMAIL: "false"
      ATK_SITE_URL: ${PUBLIC_ORIGIN:?Copy .env.example to .env and set PUBLIC_ORIGIN}
      ATK_TRUSTED_DOMAINS: ${PUBLIC_ORIGIN:?Copy .env.example to .env and set PUBLIC_ORIGIN}
      ATK_DB_TYPE: pgsql
      ATK_DB_HOST: postgres
      ATK_DB_PORT: 5432
      ATK_DB_NAME: ${POSTGRES_DB:-helt_blog}
      ATK_DB_USER: ${POSTGRES_USER:-helt}
      ATK_DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      ATK_DB_TABLE_PREFIX: artalk_
      ATK_HTTP_PROXY_HEADER: X-Real-IP
      ATK_MODERATOR_PENDING_DEFAULT: ${ARTALK_PENDING_DEFAULT:-true}
      ATK_IMG_UPLOAD_PATH: /data/artalk-img/
      ATK_IMG_UPLOAD_PUBLIC_PATH: /artalk/static/images/
    expose:
      - "23366"
    networks:
      - api
      - database
      - egress
    volumes:
      - artalk_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:23366/api/v2/conf"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio_data:
  artalk_data:

networks:
  edge:
  web:
    internal: true
  api:
    internal: true
  database:
    internal: true
  storage:
    internal: true
  egress:
